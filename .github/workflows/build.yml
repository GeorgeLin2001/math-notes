name: Build PDF

# 只监听源码变化：改了 note.tex 才触发，避免 PDF 自身的提交造成循环
"on":
  push:
    paths:
      - 'note.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 用 macos-14 而非 macos-latest：latest 为 arm64，容量紧张时排队很久
    runs-on: macos-14

    # 关键修复：GitHub Actions 的步骤脚本是非登录 shell，
    # /Library/TeX/texbin 不会自动进入 PATH，必须显式加上，否则 latexmk 报 exit 127。
    env:
      PATH: /Library/TeX/texbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight - verify LaTeX toolchain
        run: |
          set -o pipefail
          echo "== 查找 LateX 工具 =="
          for tool in latexmk xelatex kpsewhich; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "  ✓ $tool → $(command -v "$tool")"
            else
              echo "  ✗ $tool 未找到"
            fi
          done

          if ! command -v latexmk >/dev/null 2>&1; then
            echo ""
            echo "runner 上未预装 MacTeX，降级安装 TinyTeX …"
            curl -sL "https://yihui.org/tinytex/install-bin-unix.sh" | sh
            echo "$HOME/.TinyTeX/bin/universal-darwin" >> "$GITHUB_PATH"
            export PATH="$HOME/.TinyTeX/bin/universal-darwin:$PATH"
            # 按 note.tex 实际用到的宏包逐一安装（TinyTeX 是精简版，不预装这些）
            tlmgr install \
              ctex xecjk fandol zhnumber \
              amsmath amssymb amsthm mathrsfs mathtools \
              geometry \
              tikz-cd pgf \
              hyperref \
              extarrows \
              bbm \
              esint
          fi

          echo ""
          echo "== 版本信息 =="
          latexmk --version | head -2
          xelatex --version | head -1

      - name: Toolchain info
        run: |
          echo "== TeX Live =="
          kpsewhich --var-value=SELFAUTOPARENT || true
          echo "== 宏包探测 =="
          for p in ctexart.cls esint.sty extarrows.sty bbm.sty tikz-cd.sty mathtools.sty; do
            printf '  %-16s ' "$p"
            kpsewhich "$p" || echo "!!! 缺失 !!!"
          done

      - name: Build PDF
        run: |
          set -o pipefail
          mkdir -p build
          # -f: 出错也继续，把全部错误写进日志，便于一次性看到所有问题
          latexmk -xelatex -f -interaction=nonstopmode -file-line-error \
            -outdir=build -jobname=note note.tex 2>&1 | tee build/compile-output.txt
          echo "latexmk 退出码: ${PIPESTATUS[0]}"

          if [ -f build/note.pdf ]; then
            echo "✓ 已生成 build/note.pdf"
            exit 0
          fi

          echo "::error title=LaTeX 编译失败::未能生成 note.pdf，错误摘要见下方"
          echo ""
          echo "======================= 错误摘要 ======================="
          if [ -f build/note.log ]; then
            grep -nE -A3 "^!|LaTeX Error|Emergency stop|not found|Fatal error" build/note.log \
              | head -80 || echo "（note.log 中未匹配到错误行，见下方日志尾部）"
            echo "------------------- note.log 最后 40 行 -------------------"
            tail -40 build/note.log
          else
            echo "!! build/note.log 不存在 —— 编译在很早期就中断了"
          fi
          echo "========================================================"
          exit 1

      - name: Upload compile logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-compile-logs
          path: |
            build/note.log
            build/compile-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Move PDF to repository root
        run: cp build/note.pdf note.pdf

      # 幂等：只有内容真的变了才提交，重复运行不会产生空提交，也不会造成循环
      - name: Commit PDF if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add note.pdf
          if git diff --staged --quiet; then
            echo "PDF 无变化，跳过提交"
          else
            git commit -m "chore: rebuild note.pdf [skip ci]"
            git push
          fi
