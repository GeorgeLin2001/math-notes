name: Build PDF

# 只监听源码变化：改了 note.tex 才触发，避免 PDF 自身的提交造成循环
"on":
  push:
    paths:
      - 'note.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      # 注意：不要在这里写死 PATH。
      # 之前写死 /Library/TeX/texbin 导致「找不到 latexmk → TinyTeX 兜底 → 本地 PATH 没同步」
      # 的连锁问题。改为在下面按实际探测结果动态注入。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate or install LaTeX toolchain
        run: |
          set -x
          echo "== 探测预装 MacTeX =="
          TEXBIN=""
          for d in /Library/TeX/texbin /usr/local/texlive/*/bin/universal-darwin; do
            if [ -x "$d/latexmk" ]; then
              echo "  找到 latexmk: $d"
              TEXBIN="$d"; break
            fi
          done
          echo "TEXBIN='${TEXBIN}'"

          if [ -z "$TEXBIN" ]; then
            echo "== runner 未预装可用 MacTeX，改用 TinyTeX =="
            curl -sL "https://yihui.org/tinytex/install-bin-unix.sh" | sh
            TEXBIN="$HOME/.TinyTeX/bin/universal-darwin"
            echo "  安装后 TEXBIN=$TEXBIN"
            ls -la "$TEXBIN" | head -5 || true

            # 当前步骤内必须显式 export；$GITHUB_PATH 只对后续步骤生效
            export PATH="$TEXBIN:$PATH"
            echo "== 安装宏包（注意 latexmk 必须显式安装，TinyTeX 默认不含）=="
            tlmgr install \
              latexmk \
              ctex xecjk fandol zhnumber \
              amsmath amssymb amsthm mathrsfs mathtools \
              geometry tikz-cd pgf hyperref extarrows bbm esint
          fi

          # 把探测/安装结果注入后续所有步骤
          echo "$TEXBIN" >> "$GITHUB_PATH"

      - name: Verify toolchain and packages
        run: |
          set -o pipefail
          echo "PATH=$PATH"
          echo "== 工具定位 =="
          fail=0
          for t in latexmk xelatex kpsewhich tlmgr; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "  ✓ $t → $(command -v "$t")"
            else
              echo "  ✗ $t 未找到"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "::error title=LaTeX 工具缺失::见上方 ✗ 行"; exit 1; }

          echo "== 版本 =="
          latexmk --version | head -2
          xelatex --version | head -1
          echo "== TeX Live 位置 =="
          kpsewhich --var-value=SELFAUTOPARENT || true

          echo "== 宏包探测 =="
          for p in ctexart.cls esint.sty extarrows.sty bbm.sty tikz-cd.sty mathtools.sty; do
            printf '  %-16s ' "$p"
            kpsewhich "$p" || echo "!!! 缺失 !!!"
          done

      - name: Build PDF
        run: |
          set -o pipefail
          mkdir -p build
          # -f: 出错也继续，把全部错误写进日志，便于一次性看到所有问题
          latexmk -xelatex -f -interaction=nonstopmode -file-line-error \
            -outdir=build -jobname=note note.tex 2>&1 | tee build/compile-output.txt
          echo "latexmk 退出码: ${PIPESTATUS[0]}"

          if [ -f build/note.pdf ]; then
            echo "✓ 已生成 build/note.pdf ($(wc -c < build/note.pdf) bytes)"
            exit 0
          fi

          echo "::error title=LaTeX 编译失败::未能生成 note.pdf，错误摘要见下方"
          echo ""
          echo "======================= 错误摘要 ======================="
          if [ -f build/note.log ]; then
            grep -nE -A3 "^!|LaTeX Error|Emergency stop|not found|Fatal error" build/note.log \
              | head -80 || echo "（note.log 中未匹配到错误行，见下方日志尾部）"
            echo "------------------- note.log 最后 40 行 -------------------"
            tail -40 build/note.log
          else
            echo "!! build/note.log 不存在 —— 编译在很早期就中断了"
          fi
          echo "========================================================"
          exit 1

      - name: Upload compile logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-compile-logs
          path: |
            build/note.log
            build/compile-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Show package list on failure
        if: failure()
        run: |
          echo "== 已安装宏包（可能因 mac 上 tlmgr 输出较长而截断）=="
          tlmgr list --only-installed 2>/dev/null | head -60 || echo "(tlmgr 不可用)"

      - name: Move PDF to repository root
        run: cp build/note.pdf note.pdf

      # 幂等：只有内容真的变了才提交，重复运行不会产生空提交，也不会造成循环
      - name: Commit PDF if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add note.pdf
          if git diff --staged --quiet; then
            echo "PDF 无变化，跳过提交"
          else
            git commit -m "chore: rebuild note.pdf [skip ci]"
            git push
          fi
